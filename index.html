<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gas Price Finder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; padding: 1rem; }
  #app { max-width: 480px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; padding: 1rem 0; border-bottom: 1px solid #e0e0d8; }
  .header-icon { font-size: 28px; }
  .header h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
  .header p { font-size: 13px; color: #888; margin-top: 2px; }
  .locate-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 12px; background: #1a73e8; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
  .locate-btn:hover { background: #1557b0; }
  .locate-btn:disabled { background: #a0b8e0; cursor: not-allowed; }
  .radius-row { margin-top: 1.25rem; }
  .radius-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .radius-label span { font-size: 13px; color: #666; }
  .radius-label strong { font-size: 14px; color: #1a1a1a; }
  input[type=range] { width: 100%; accent-color: #1a73e8; height: 4px; cursor: pointer; }
  .radius-ticks { display: flex; justify-content: space-between; margin-top: 4px; }
  .radius-ticks span { font-size: 11px; color: #bbb; }
  .status { font-size: 13px; color: #666; text-align: center; margin: 1rem 0; min-height: 20px; }
  .status.error { color: #d32f2f; }
  .fuel-selector { display: flex; gap: 6px; margin-bottom: 1rem; }
  .fuel-btn { flex: 1; font-size: 13px; padding: 7px 4px; border-radius: 8px; border: 1px solid #ddd; background: white; color: #555; cursor: pointer; text-align: center; transition: all 0.15s; }
  .fuel-btn.active { background: #fff3e0; color: #e65100; border-color: #ffb74d; font-weight: 600; }
  .filters { display: flex; gap: 8px; margin-bottom: 1rem; }
  .filter-btn { font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: white; color: #666; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: #e8f0fe; color: #1a73e8; border-color: #a8c0f5; font-weight: 600; }
  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
  .refresh-btn { font-size: 13px; color: #888; background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; }
  .refresh-btn:hover { color: #333; }
  .last-updated { font-size: 12px; color: #aaa; }
 
  /* Average banner */
  .avg-banner { background: white; border: 1px solid #e0e0d8; border-radius: 12px; padding: 0.9rem 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .avg-left { display: flex; flex-direction: column; gap: 2px; }
  .avg-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.4px; }
  .avg-price { font-size: 26px; font-weight: 700; color: #1a1a1a; line-height: 1.1; }
  .avg-fuel-label { font-size: 12px; color: #aaa; }
  .avg-right { text-align: right; }
  .avg-based-on { font-size: 12px; color: #999; }
  .avg-range { font-size: 12px; color: #666; margin-top: 3px; }
 
  .station-list { display: flex; flex-direction: column; gap: 10px; }
  .station-card { background: white; border: 1px solid #e8e8e0; border-radius: 12px; padding: 1rem 1.25rem; position: relative; }
  .station-card.cheapest { border: 2px solid #2e7d32; }
  .cheapest-badge { position: absolute; top: -11px; left: 12px; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px; border: 1px solid #a5d6a7; }
  .station-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .station-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .station-address { font-size: 12px; color: #888; margin-top: 3px; line-height: 1.4; }
  .price-block { text-align: right; flex-shrink: 0; }
  .price { font-size: 24px; font-weight: 700; color: #1a1a1a; line-height: 1; }
  .price-label { font-size: 11px; color: #aaa; margin-top: 2px; }
  .no-price { font-size: 12px; color: #bbb; font-style: italic; text-align: right; }
  .station-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0e8; }
  .distance { font-size: 12px; color: #888; }
  .bottom-right { display: flex; align-items: center; gap: 12px; }
  .rating { font-size: 12px; color: #888; }
  .maps-link { font-size: 12px; color: #1a73e8; text-decoration: none; }
  .maps-link:hover { text-decoration: underline; }
 
  /* vs average tag */
  .vs-avg { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; margin-top: 5px; display: inline-block; }
  .vs-avg.below { background: #e8f5e9; color: #2e7d32; }
  .vs-avg.above { background: #fce8e6; color: #c62828; }
  .vs-avg.at { background: #f5f5f5; color: #777; }
 
  .results-status { font-size: 12px; color: #aaa; text-align: center; margin-top: 1rem; padding-bottom: 1rem; }
  .radius-results-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
  .radius-results-label { font-size: 13px; color: #666; }
  .radius-results-label strong { color: #1a1a1a; }
  #results-view { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-icon">⛽</div>
    <div>
      <h1>Gas Price Finder</h1>
      <p>Cheapest fuel near you, right now</p>
    </div>
  </div>
 
  <div id="main-view">
    <button class="locate-btn" id="locateBtn" onclick="handleMainButton()">
      📍 Find cheapest gas near me
    </button>
    <div class="radius-row">
      <div class="radius-label">
        <span>Search radius</span>
        <strong id="radiusDisplay">5.0 miles</strong>
      </div>
      <input type="range" id="radiusSlider" min="0.5" max="10" step="0.5" value="5" oninput="updateRadiusDisplay(this.value)">
      <div class="radius-ticks">
        <span>0.5 mi</span>
        <span>2.5 mi</span>
        <span>5 mi</span>
        <span>7.5 mi</span>
        <span>10 mi</span>
      </div>
    </div>
    <p class="status" id="status"></p>
  </div>
 
  <div id="results-view">
    <div class="fuel-selector" id="fuelSelector"></div>
    <div class="refresh-row">
      <button class="refresh-btn" onclick="refresh()">🔄 Refresh</button>
      <span class="last-updated" id="lastUpdated"></span>
    </div>
    <div class="radius-results-row">
      <span class="radius-results-label">Within <strong id="radiusResultsLabel">5.0 miles</strong></span>
      <button class="filter-btn" onclick="changeRadius()">Change radius</button>
    </div>
 
    <!-- Average banner -->
    <div class="avg-banner" id="avgBanner" style="display:none;">
      <div class="avg-left">
        <span class="avg-label">Area average</span>
        <span class="avg-price" id="avgPrice">—</span>
        <span class="avg-fuel-label" id="avgFuelLabel">Regular</span>
      </div>
      <div class="avg-right">
        <div class="avg-based-on" id="avgBasedOn"></div>
        <div class="avg-range" id="avgRange"></div>
      </div>
    </div>
 
    <div class="filters">
      <button class="filter-btn active" id="sortPrice" onclick="setSort('price',this)">↑ Cheapest first</button>
      <button class="filter-btn" id="sortDist" onclick="setSort('distance',this)">📍 Nearest first</button>
    </div>
    <div class="station-list" id="stationList"></div>
    <p class="results-status" id="resultsStatus"></p>
  </div>
</div>
 
<script>
const API_KEY = 'AIzaSyCppmZPSsry9rEW2EuEJ5oC7ERCkQGf2fo';
let userLat = null, userLng = null, allStations = [], currentSort = 'price', currentFuel = 0, currentRadius = 5;
let locationKnown = false;
const fuelTypes = ['Regular', 'Midgrade', 'Premium', 'Diesel'];
const fuelFields = ['regular', 'midgrade', 'premium', 'diesel'];
 
function updateRadiusDisplay(val) {
  currentRadius = parseFloat(val);
  document.getElementById('radiusDisplay').textContent = parseFloat(val).toFixed(1) + ' miles';
}
 
function handleMainButton() {
  currentRadius = parseFloat(document.getElementById('radiusSlider').value);
  if (locationKnown) {
    searchWithCurrentLocation();
  } else {
    findGas();
  }
}
 
function changeRadius() {
  document.getElementById('results-view').style.display = 'none';
  document.getElementById('main-view').style.display = 'block';
  document.getElementById('radiusSlider').value = currentRadius;
  document.getElementById('radiusDisplay').textContent = currentRadius.toFixed(1) + ' miles';
  const btn = document.getElementById('locateBtn');
  btn.disabled = false;
  btn.textContent = '📍 Search this radius';
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = 'status';
}
 
function setSort(type, btn) {
  currentSort = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderStations();
}
 
function setFuel(idx, btn) {
  currentFuel = idx;
  document.querySelectorAll('.fuel-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderStations();
  updateAverageBanner();
}
 
function refresh() {
  locationKnown = false;
  document.getElementById('results-view').style.display = 'none';
  document.getElementById('main-view').style.display = 'block';
  document.getElementById('radiusSlider').value = currentRadius;
  document.getElementById('radiusDisplay').textContent = currentRadius.toFixed(1) + ' miles';
  const btn = document.getElementById('locateBtn');
  btn.disabled = false;
  btn.textContent = '📍 Find cheapest gas near me';
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = 'status';
}
 
function haversine(lat1, lng1, lat2, lng2) {
  const R = 3958.8;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
 
function findGas() {
  const btn = document.getElementById('locateBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status';
  status.textContent = 'Getting your location...';
  if (!navigator.geolocation) {
    status.className = 'status error';
    status.textContent = 'Geolocation is not supported by your browser.';
    btn.disabled = false;
    return;
  }
  navigator.geolocation.getCurrentPosition(async pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    locationKnown = true;
    status.textContent = 'Searching for nearby gas stations...';
    try { await fetchStations(); }
    catch(e) {
      console.error(e);
      status.className = 'status error';
      status.textContent = 'Error: ' + (e.message || 'Could not fetch stations. Please try again.');
      btn.disabled = false;
    }
  }, err => {
    status.className = 'status error';
    status.textContent = 'Location access denied. Please allow location access and try again.';
    btn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 10000 });
}
 
async function searchWithCurrentLocation() {
  const btn = document.getElementById('locateBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status';
  status.textContent = 'Searching with new radius...';
  try { await fetchStations(); }
  catch(e) {
    console.error(e);
    status.className = 'status error';
    status.textContent = 'Error: ' + (e.message || 'Could not fetch stations. Please try again.');
    btn.disabled = false;
  }
}
 
async function fetchStations() {
  const radiusMeters = currentRadius * 1609.34;
  const url = 'https://places.googleapis.com/v1/places:searchNearby';
  const body = {
    includedTypes: ['gas_station'],
    maxResultCount: 20,
    locationRestriction: {
      circle: { center: { latitude: userLat, longitude: userLng }, radius: radiusMeters }
    }
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': API_KEY,
      'X-Goog-FieldMask': 'places.id,places.displayName,places.formattedAddress,places.location,places.rating,places.googleMapsUri,places.fuelOptions'
    },
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  if (!data.places || data.places.length === 0) {
    document.getElementById('status').className = 'status error';
    document.getElementById('status').textContent = 'No gas stations found in this radius. Try increasing the search radius.';
    document.getElementById('locateBtn').disabled = false;
    return;
  }
  allStations = data.places.map(p => {
    const loc = p.location || {};
    const dist = haversine(userLat, userLng, loc.latitude || 0, loc.longitude || 0);
    const fuel = p.fuelOptions?.fuelPrices || [];
    const prices = { regular: null, midgrade: null, premium: null, diesel: null };
    fuel.forEach(f => {
      const t = (f.type || '').toLowerCase();
      const price = f.price?.units != null ? parseFloat(f.price.units) + (f.price.nanos || 0) / 1e9 : null;
      if (t.includes('regular') || t === 'unleaded_87' || t === 'regular_unleaded') prices.regular = price;
      else if (t.includes('midgrade') || t === 'unleaded_89') prices.midgrade = price;
      else if (t.includes('premium') || t.includes('unleaded_9')) prices.premium = price;
      else if (t.includes('diesel')) prices.diesel = price;
    });
    return {
      name: p.displayName?.text || 'Gas Station',
      address: (p.formattedAddress || '').split(',').slice(0,2).join(','),
      lat: loc.latitude, lng: loc.longitude,
      distance: dist,
      rating: p.rating || null,
      mapsUrl: p.googleMapsUri || `https://maps.google.com/?q=${loc.latitude},${loc.longitude}`,
      prices
    };
  });
 
  document.getElementById('radiusResultsLabel').textContent = currentRadius.toFixed(1) + ' miles';
  const btn = document.getElementById('locateBtn');
  btn.textContent = '📍 Find cheapest gas near me';
  buildFuelSelector();
  updateAverageBanner();
  document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  document.getElementById('main-view').style.display = 'none';
  document.getElementById('results-view').style.display = 'block';
  renderStations();
}
 
function calculateAverage() {
  const field = fuelFields[currentFuel];
  const priced = allStations.filter(s => s.prices[field] !== null).map(s => s.prices[field]);
  if (priced.length === 0) return null;
  const avg = priced.reduce((a, b) => a + b, 0) / priced.length;
  const min = Math.min(...priced);
  const max = Math.max(...priced);
  return { avg, min, max, count: priced.length };
}
 
function updateAverageBanner() {
  const banner = document.getElementById('avgBanner');
  const stats = calculateAverage();
  if (!stats) {
    banner.style.display = 'none';
    return;
  }
  banner.style.display = 'flex';
  document.getElementById('avgPrice').textContent = '$' + stats.avg.toFixed(2);
  document.getElementById('avgFuelLabel').textContent = fuelTypes[currentFuel];
  document.getElementById('avgBasedOn').textContent = `Based on ${stats.count} station${stats.count !== 1 ? 's' : ''}`;
  document.getElementById('avgRange').textContent = `Range: $${stats.min.toFixed(2)} – $${stats.max.toFixed(2)}`;
}
 
function buildFuelSelector() {
  document.getElementById('fuelSelector').innerHTML = fuelTypes.map((t, i) => {
    const has = allStations.some(s => s.prices[fuelFields[i]] !== null);
    return `<button class="fuel-btn${i===0?' active':''}" onclick="setFuel(${i},this)"${!has?' style="opacity:0.45"':''}>${t}</button>`;
  }).join('');
}
 
function renderStations() {
  const field = fuelFields[currentFuel];
  const stats = calculateAverage();
  let stations = [...allStations];
 
  if (currentSort === 'price') {
    const withPrice = stations.filter(s => s.prices[field] !== null).sort((a,b) => a.prices[field] - b.prices[field]);
    const noPrice = stations.filter(s => s.prices[field] === null).sort((a,b) => a.distance - b.distance);
    stations = [...withPrice, ...noPrice];
  } else {
    stations.sort((a,b) => a.distance - b.distance);
  }
 
  const pricedCount = stations.filter(s => s.prices[field] !== null).length;
 
  document.getElementById('stationList').innerHTML = stations.map((s, i) => {
    const isCheapest = i === 0 && s.prices[field] !== null && currentSort === 'price';
    const price = s.prices[field];
    const dist = s.distance < 0.2 ? (s.distance * 5280).toFixed(0) + ' ft' : s.distance.toFixed(1) + ' mi';
 
    // vs average tag
    let vsAvgHtml = '';
    if (price !== null && stats) {
      const diff = price - stats.avg;
      const absDiff = Math.abs(diff).toFixed(2);
      if (Math.abs(diff) < 0.01) {
        vsAvgHtml = `<span class="vs-avg at">≈ Area average</span>`;
      } else if (diff < 0) {
        vsAvgHtml = `<span class="vs-avg below">💰 $${absDiff} below average</span>`;
      } else {
        vsAvgHtml = `<span class="vs-avg above">⬆ $${absDiff} above average</span>`;
      }
    }
 
    return `<div class="station-card${isCheapest?' cheapest':''}">
      ${isCheapest ? '<span class="cheapest-badge">✓ Cheapest nearby</span>' : ''}
      <div class="station-top">
        <div>
          <div class="station-name">${s.name}</div>
          <div class="station-address">${s.address}</div>
        </div>
        <div class="price-block">
          ${price !== null
            ? `<div class="price">$${price.toFixed(2)}</div><div class="price-label">${fuelTypes[currentFuel]}</div>`
            : `<div class="no-price">Price<br>unknown</div>`}
        </div>
      </div>
      ${vsAvgHtml ? `<div style="margin-top:6px;">${vsAvgHtml}</div>` : ''}
      <div class="station-bottom">
        <span class="distance">📍 ${dist} away</span>
        <div class="bottom-right">
          ${s.rating ? `<span class="rating">⭐ ${s.rating.toFixed(1)}</span>` : ''}
          <a class="maps-link" href="${s.mapsUrl}" target="_blank">Directions →</a>
        </div>
      </div>
    </div>`;
  }).join('');
 
  document.getElementById('resultsStatus').textContent =
    pricedCount === 0
      ? `${stations.length} stations found — live prices not yet available in this area. Try refreshing.`
      : `${stations.length} stations found · ${pricedCount} with live prices`;
}
</script>
</body>
</html>
